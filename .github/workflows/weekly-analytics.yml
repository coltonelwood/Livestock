name: weekly-analytics
# Analytics Agent: weekly executive report + recs. Produces ONLY pending/proposed drafts for review in the Agent Control
# Center. Never sends, spends, merges, or deploys. No-ops without secrets.
on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run analytics agent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_TRIGGER: schedule
        run: node agents/claude/run.mjs analytics
